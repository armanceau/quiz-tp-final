<div class="min-h-screen bg-gradient-to-b from-gray-50 to-white py-12">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="text-center mb-12">
      <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl">
        Catégories de Quiz
      </h1>
      <p class="mt-4 text-lg text-gray-600">
        Sélectionnez une catégorie pour commencer votre quiz
      </p>
    </div>
    
   
    <div class="flex gap-3 mb-6">
      <input 
        type="text" 
        id="recherche" 
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        placeholder="Rechercher une catégorie..." 
        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" 
      />
      <button 
        (click)="onSearch()"
        type="button"
        class="px-6 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition"
        aria-label="Rechercher"
      >
        Rechercher
      </button>
      <button 
        (click)="clearSearch()"
        type="button"
        class="px-6 py-2 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 transition"
        aria-label="Réinitialiser"
      >
        Reset
      </button>
    </div>

    <!-- Categories Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Section d'origine conservée exactement -->
      <section class="question_container" *ngFor="let content of filteredCategories; let i = index">
        <h4 class="question_label">{{ content?.name }}</h4>
        <button (click)="redirectTo(content.id)"  type="button" class="px-4 py-2 rounded-full border border-gray-300 bg-white text-gray-800 hover:border-indigo-500 hover:bg-indigo-50 transition text-sm font-medium" aria-label="HTML">{{ content?.name }}</button>
      </section>
    </div>
  </div>
</div>
